# Netlify's own builds are stopped (2026-09-25): GitHub Actions builds, tests and deploys dist/
# (.github/workflows/ci.yml). This section documents the build and serves a manual `netlify build`.
[build]
  command = "bun run generate"
  # On Netlify, Nitro detects the platform and uses its netlify-static preset, which writes the
  # site to dist/ (with _headers and a 404 fallback in _redirects); local builds use .output/public.
  publish = "dist"

[build.environment]
  # Nuxt 4.5.2 requires Node ^22.19.0 || ^24.11.0 || >=26.0.0
  NODE_VERSION = "24"
