<!doctype html>
<html data-pui-mode="light">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chrissgon/perfectui@1.0.0-beta.0/dist/perfectui.css" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=block" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--pui-bg); color: var(--pui-text); }
  code, .mono { font-family: "Fira Code", ui-monospace, monospace; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .safe { position: absolute; inset: 64px; display: flex; flex-direction: column; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#D1D5DB 1.2px, transparent 1.2px); background-size: 24px 24px; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#F3F4F6 1px, transparent 1px), linear-gradient(90deg, #F3F4F6 1px, transparent 1px); background-size: 80px 80px; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow.purple { background: rgba(115, 64, 217, .12); width: 560px; height: 360px; }
  .glow.blue { background: rgba(26, 140, 191, .10); width: 460px; height: 300px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 32px; width: auto; }
  .ver { font: 500 24px/1 Inter; color: var(--pui-text-muted); }
  .muted { color: var(--pui-text-muted); }
  .ink { color: #00628B; }
  .blue { color: #0092CD; }
  .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .desc code { font-size: .9em; }
</style>
</head>
<body>
<div class="card">
  <div class="dots" style="opacity:.55"></div>
  <div class="glow purple" style="right:-120px;top:-140px"></div>
  <div class="glow blue" style="right:220px;bottom:-160px"></div>
  <div class="safe">
    <div class="brand" style="justify-content:space-between"><span class="brand"><img src="../../assets/wordmark.svg" alt="Perfect UI" /><span class="ver">v1</span></span>
      <button class="pui-btn pui-solid pui-theme" style="--pui-font-size:22px;--pui-space:7px;font-family:Inter;font-weight:500" tabindex="-1">pui-btn</button></div>
    <code class="ink" style="margin-top:56px;font-size:28px">Components</code>
    <h1 class="clamp2" style="margin-top:8px;font:600 96px/1.05 Inter;letter-spacing:-.03em">Button</h1>
    <p class="muted desc clamp3" style="margin-top:auto;font:400 32px/1.35 Inter;max-width:1000px">The <code>pui-btn</code> class turns a <code>&lt;button&gt;</code> or an <code>&lt;a&gt;</code> into a button. It brings the shape only: pair it with a style and a color.</p>
  </div>
</div>
</body>
</html>
