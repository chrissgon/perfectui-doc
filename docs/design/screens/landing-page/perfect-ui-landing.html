 true }}\"><span style=\"display:inline-block;width:2px;height:1.1em;vertical-align:-0.2em;background:var(--pui-theme);animation:pui-caret 1s steps(1) infinite\"><\u002Fspan><\u002Fsc-if><span style=\"color:var(--pui-text-muted)\">\"&gt;{{ demo.label }}&lt;/{{ demo.tag }}&gt;<\u002Fspan><\u002Fcode>\n          <div style=\"display:flex;gap:8px;align-items:center\">\n            <sc-for list=\"{{ demo.slots }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <span class=\"{{ s.cls }}\" style=\"font-family:var(--pui-font-mono)\">{{ s.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ giantBottom }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:auto;padding:48px 0 44px\">\n        <p style=\"margin:0;display:flex;flex-direction:column;gap:24px\">\n          <span style=\"font-size:22px;font-weight:600;letter-spacing:-0.01em;padding-left:10px\">Three classes, no framework,<\u002Fspan>\n          <span style=\"font-size:clamp(120px,17vw,216px);line-height:0.82;font-weight:600;letter-spacing:-0.065em;white-space:nowrap\">3.2 <span style=\"color:var(--pui-theme)\">kB<\u002Fspan>.<\u002Fspan>\n        <\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"height:64px;flex:none\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section ref=\"{{ chartRef }}\" data-screen-label=\"02 Measured\" data-pui-mode=\"{{ inverseMode }}\" style=\"position:relative;overflow:hidden;background:var(--pui-bg);color:var(--pui-text)\">\n  <div aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none\">\n    <div style=\"position:absolute;width:1000px;height:800px;left:-280px;top:-260px;background:radial-gradient(closest-side,color-mix(in oklab,var(--pui-theme) 30%,transparent),transparent)\"><\u002Fdiv>\n    <div style=\"position:absolute;width:900px;height:900px;right:-300px;bottom:-420px;background:radial-gradient(closest-side,color-mix(in oklab,color-mix(in oklab,var(--pui-theme),#3c32aa 60%) 28%,transparent),transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:clamp(96px,12vw,160px) clamp(20px,5vw,40px) clamp(88px,11vw,140px);box-sizing:border-box\">\n    <h2 style=\"margin:0;font-size:clamp(36px,5vw,64px);line-height:1.02;font-weight:600;letter-spacing:-0.035em;max-width:16ch\">3.2 kB. Measured, not promised.<\u002Fh2>\n    <p style=\"margin:28px 0 0;font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:var(--pui-text-muted);max-width:60ch;text-wrap:pretty\">perfectui.css is 3,155 bytes gzip; the optional JavaScript loader is 502. The bars below are the same measurement run on the published builds of the alternatives.<\u002Fp>\n\n    <div style=\"margin-top:clamp(48px,7vw,88px)\">\n      <div style=\"display:flex;justify-content:flex-end;gap:20px;padding-bottom:16px;font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted)\">\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:2px;background:var(--pui-text)\"><\u002Fspan>CSS<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:10px;height:10px;border-radius:2px;background:color-mix(in oklab,var(--pui-text) 35%,transparent)\"><\u002Fspan>JavaScript<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;border-top:1px solid var(--pui-border);padding:22px 0\">\n        <div style=\"flex:{{ L.nameFlex }};display:flex;flex-direction:column\"><span style=\"font-weight:600;color:var(--pui-theme-ink)\">perfectui<\u002Fspan><span style=\"font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted)\">1.0.0-beta.0<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:{{ L.barFlex }};order:{{ L.barOrder }};min-width:0;display:flex;height:28px;gap:2px\">\n          <div style=\"width:{{ rowP.css }}%;background:var(--pui-theme);border-radius:3px 0 0 3px\"><\u002Fdiv>\n          <div style=\"width:{{ rowP.js }}%;background:color-mix(in oklab,var(--pui-theme) 45%,transparent);border-radius:0 3px 3px 0\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto;min-width:150px;text-align:right;font-family:var(--pui-font-mono);font-variant-numeric:tabular-nums\"><span style=\"font-size:20px;font-weight:600\">{{ rowP.total }}<\u002Fspan><span style=\"display:block;font-size:12px;color:var(--pui-text-muted)\">{{ rowP.split }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;border-top:1px solid var(--pui-border);padding:22px 0\">\n          <div style=\"flex:{{ L.nameFlex }};display:flex;flex-direction:column\"><span style=\"font-weight:600\">{{ r.name }}<\u002Fspan><span style=\"font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted)\">{{ r.version }}<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:{{ L.barFlex }};order:{{ L.barOrder }};min-width:0;display:flex;height:28px;gap:2px\">\n            <div style=\"width:{{ r.css }}%;background:color-mix(in oklab,var(--pui-muted) 70%,transparent);border-radius:3px 0 0 3px\"><\u002Fdiv>\n            <div style=\"width:{{ r.js }}%;background:color-mix(in oklab,var(--pui-muted) 32%,transparent);border-radius:0 3px 3px 0\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:0 0 auto;min-width:150px;text-align:right;font-family:var(--pui-font-mono);font-variant-numeric:tabular-nums\"><span style=\"font-size:20px;font-weight:600\">{{ r.total }}<\u002Fspan><span style=\"display:block;font-size:12px;color:var(--pui-text-muted)\">{{ r.split }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <p style=\"margin:0;border-top:1px solid var(--pui-border);padding-top:16px;font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted)\">gzip -9 of the published builds, measured 2026-09-23<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 Classes\" style=\"position:relative;overflow:hidden\">\n  <div aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 14%,transparent) 1px,transparent 1.5px);background-size:24px 24px;mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:clamp(96px,12vw,160px) clamp(20px,5vw,40px);box-sizing:border-box\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:24px 64px;align-items:flex-end\">\n      <h2 style=\"flex:1 1 420px;margin:0;font-size:clamp(36px,5vw,64px);line-height:1.02;font-weight:600;letter-spacing:-0.035em\">A shape, a style, a colour.<\u002Fh2>\n      <p style=\"flex:1 1 420px;margin:0;font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:var(--pui-text-muted);text-wrap:pretty;background:var(--pui-bg)\">Every element is up to three classes you can combine freely: what it is, how the colour is applied, which colour. Seven colours and four styles give 28 looks per shape, and adding a colour never multiplies your classes.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"pui-card\" style=\"margin-top:clamp(40px,6vw,72px)\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 40px;padding:16px;border-bottom:1px solid var(--pui-border)\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted);width:48px\">shape<\u002Fspan>\n          <sc-for list=\"{{ shapeChips }}\" as=\"c\" hint-placeholder-count=\"3\"><button class=\"{{ c.cls }}\" aria-pressed=\"{{ c.pressed }}\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted);width:48px\">style<\u002Fspan>\n          <sc-for list=\"{{ styleChips }}\" as=\"c\" hint-placeholder-count=\"4\"><button class=\"{{ c.cls }}\" aria-pressed=\"{{ c.pressed }}\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\"><span style=\"font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted);width:48px\">colour<\u002Fspan>\n          <sc-for list=\"{{ colourChips }}\" as=\"c\" hint-placeholder-count=\"7\"><button class=\"{{ c.cls }}\" aria-pressed=\"{{ c.pressed }}\" sc-camel-on-click=\"{{ c.pick }}\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap\">\n        <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--pui-border)\">\n          <div style=\"flex:1;min-height:clamp(220px,26vw,300px);display:grid;place-items:center;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 16%,transparent) 1px,transparent 1.5px);background-size:16px 16px;background-position:8px 8px\">\n            <div style=\"transform:scale(3)\"><button class=\"{{ live.cls }}\" tabindex=\"-1\">{{ live.label }}<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <code style=\"display:block;padding:16px;border-top:1px solid var(--pui-border);font-family:var(--pui-font-mono);font-size:14px;line-height:1.5\"><span style=\"color:var(--pui-text-muted)\">&lt;{{ live.tag }} class=\"<\u002Fspan><sc-for list=\"{{ live.tokens }}\" as=\"k\" hint-placeholder-count=\"3\"><span class=\"{{ k.cls }}\" style=\"padding:1px 3px\">{{ k.t }}<\u002Fspan><\u002Fsc-for><span style=\"color:var(--pui-text-muted)\">\"&gt;<\u002Fspan><\u002Fcode>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 auto;min-width:0;overflow-x:auto;padding:24px 28px;display:grid;justify-content:center;grid-template-columns:52px repeat(7,auto);gap:10px 8px;align-items:center;justify-items:center\">\n          <span><\u002Fspan>\n          <sc-for list=\"{{ colourNames }}\" as=\"n\" hint-placeholder-count=\"7\"><span style=\"font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted)\">{{ n }}<\u002Fspan><\u002Fsc-for>\n          <sc-for list=\"{{ matrix }}\" as=\"row\" hint-placeholder-count=\"4\">\n            <span style=\"justify-self:start;font-family:var(--pui-font-mono);font-size:12px;color:var(--pui-text-muted)\">{{ row.name }}<\u002Fspan>\n            <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"7\">\n              <div style=\"padding:4px;border:1px dashed {{ cell.ring }};border-radius:9px\"><button class=\"{{ cell.cls }}\" aria-label=\"{{ cell.aria }}\" sc-camel-on-click=\"{{ cell.pick }}\">{{ live.label }}<\u002Fbutton><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px\"><a href=\"#\" class=\"pui-btn pui-link pui-theme\" style=\"padding-inline:0\">See the components<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 Overlays\" style=\"position:relative;border-top:1px solid var(--pui-border)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(96px,12vw,160px) clamp(20px,5vw,40px);box-sizing:border-box\">\n    <h2 style=\"margin:0;font-size:clamp(36px,5vw,64px);line-height:1.02;font-weight:600;letter-spacing:-0.035em\">Overlays without a plugin.<\u002Fh2>\n    <p style=\"margin:28px 0 0;font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:var(--pui-text-muted);max-width:62ch;text-wrap:pretty\">Modals are &lt;dialog&gt;, menus are popover, tooltips are interestfor, accordions are &lt;details&gt;. The optional loader downloads a fallback only when a browser is missing one of them.<\u002Fp>\n\n    <div class=\"pui-card\" style=\"margin-top:clamp(40px,6vw,72px)\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:1px;background:var(--pui-border)\">\n\n        <div style=\"background:var(--pui-bg);display:flex;flex-direction:column;min-width:0\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--pui-border)\"><span style=\"font-weight:600\">Modal <span style=\"font-family:var(--pui-font-mono);font-weight:400;color:var(--pui-text-muted)\">&lt;dialog&gt;<\u002Fspan><\u002Fspan><span class=\"pui-badge pui-soft pui-success\">no JavaScript of yours<\u002Fspan><\u002Fdiv>\n          <div style=\"height:176px;display:grid;place-items:center;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 14%,transparent) 1px,transparent 1.5px);background-size:16px 16px\">\n            <button class=\"pui-btn pui-solid pui-theme\" data-cf=\"pui-demo-modal\" data-cmd=\"show-modal\">Delete project<\u002Fbutton>\n          <\u002Fdiv>\n          <pre style=\"margin:0;padding:16px;border-top:1px solid var(--pui-border);font:13px/1.6 var(--pui-font-mono);overflow-x:auto\">&lt;button <span style=\"color:var(--pui-theme-ink)\">commandfor<\u002Fspan>=\"confirm\" <span style=\"color:var(--pui-theme-ink)\">command<\u002Fspan>=\"show-modal\"&gt;\n&lt;dialog class=\"pui-modal\" id=\"confirm\" closedby=\"any\"&gt;<\u002Fpre>\n          <dialog class=\"pui-modal\" id=\"pui-demo-modal\" data-closedby=\"any\">\n            <div class=\"pui-card\">\n              <div class=\"pui-card-header\">Delete project<\u002Fdiv>\n              <div class=\"pui-card-content\">\n                <span>This cannot be undone.<\u002Fspan>\n                <div class=\"pui-group-row\">\n                  <button class=\"pui-btn pui-outline pui-surface\" data-cf=\"pui-demo-modal\" data-cmd=\"close\">Cancel<\u002Fbutton>\n                  <button class=\"pui-btn pui-solid pui-error\" data-cf=\"pui-demo-modal\" data-cmd=\"close\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdialog>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--pui-bg);display:flex;flex-direction:column;min-width:0\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--pui-border)\"><span style=\"font-weight:600\">Dropdown <span style=\"font-family:var(--pui-font-mono);font-weight:400;color:var(--pui-text-muted)\">popover<\u002Fspan><\u002Fspan><span class=\"pui-badge pui-soft pui-success\">no JavaScript of yours<\u002Fspan><\u002Fdiv>\n          <div style=\"height:176px;display:grid;place-items:center;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 14%,transparent) 1px,transparent 1.5px);background-size:16px 16px\">\n            <button class=\"pui-btn pui-outline pui-surface\" data-pt=\"pui-demo-menu\">Options<span class=\"icon icon-chevron-down\"><\u002Fspan><\u002Fbutton>\n            <div id=\"pui-demo-menu\" data-popover=\"auto\" class=\"pui-dropdown\">\n              <div style=\"display:grid;gap:2px\">\n                <button class=\"pui-btn pui-link pui-surface\" style=\"justify-content:flex-start;gap:10px\"><span class=\"icon icon-pencil\"><\u002Fspan>Edit<\u002Fbutton>\n                <button class=\"pui-btn pui-link pui-surface\" style=\"justify-content:flex-start;gap:10px\"><span class=\"icon icon-share-2\"><\u002Fspan>Share<\u002Fbutton>\n                <button class=\"pui-btn pui-link pui-error\" style=\"justify-content:flex-start;gap:10px\"><span class=\"icon icon-trash-2\"><\u002Fspan>Delete<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <pre style=\"margin:0;padding:16px;border-top:1px solid var(--pui-border);font:13px/1.6 var(--pui-font-mono);overflow-x:auto\">&lt;button <span style=\"color:var(--pui-theme-ink)\">popovertarget<\u002Fspan>=\"menu\"&gt;Options&lt;/button&gt;\n&lt;div class=\"pui-dropdown\" id=\"menu\" <span style=\"color:var(--pui-theme-ink)\">popover<\u002Fspan>&gt;<\u002Fpre>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--pui-bg);display:flex;flex-direction:column;min-width:0\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--pui-border)\"><span style=\"font-weight:600\">Tooltip <span style=\"font-family:var(--pui-font-mono);font-weight:400;color:var(--pui-text-muted)\">interestfor<\u002Fspan><\u002Fspan><span class=\"pui-badge pui-soft pui-success\">no JavaScript of yours<\u002Fspan><\u002Fdiv>\n          <div style=\"height:176px;display:grid;place-items:center;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 14%,transparent) 1px,transparent 1.5px);background-size:16px 16px\">\n            <div style=\"display:flex;gap:8px;align-items:center\">\n              <input class=\"pui-input\" placeholder=\"ana@perfectui.dev\" aria-label=\"Email\" style=\"width:200px;background:var(--pui-bg)\">\n              <button class=\"pui-btn pui-outline pui-surface\" data-if=\"pui-demo-tip\" aria-label=\"Why we ask\">?<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"pui-tooltip\" id=\"pui-demo-tip\" data-popover=\"hint\">We never share your email.<\u002Fdiv>\n          <\u002Fdiv>\n          <pre style=\"margin:0;padding:16px;border-top:1px solid var(--pui-border);font:13px/1.6 var(--pui-font-mono);overflow-x:auto\">&lt;button <span style=\"color:var(--pui-theme-ink)\">interestfor<\u002Fspan>=\"help\"&gt;?&lt;/button&gt;\n&lt;div class=\"pui-tooltip\" id=\"help\" <span style=\"color:var(--pui-theme-ink)\">popover<\u002Fspan>=\"hint\"&gt;<\u002Fpre>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--pui-bg);display:flex;flex-direction:column;min-width:0\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--pui-border)\"><span style=\"font-weight:600\">Accordion <span style=\"font-family:var(--pui-font-mono);font-weight:400;color:var(--pui-text-muted)\">&lt;details&gt;<\u002Fspan><\u002Fspan><span class=\"pui-badge pui-soft pui-success\">no JavaScript of yours<\u002Fspan><\u002Fdiv>\n          <div style=\"min-height:176px;box-sizing:border-box;padding:24px clamp(16px,4vw,48px);display:grid;align-content:center;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 14%,transparent) 1px,transparent 1.5px);background-size:16px 16px\">\n            <div class=\"pui-accordion\" style=\"background:var(--pui-bg)\">\n              <details class=\"pui-accordion-item\" name=\"pui-demo-acc\" open=\"{{ true }}\"><summary>Billing address<\u002Fsummary><div>Rua Augusta 1200, São Paulo<\u002Fdiv><\u002Fdetails>\n              <details class=\"pui-accordion-item\" name=\"pui-demo-acc\"><summary>Payment method<\u002Fsummary><div>Visa ending in 4242<\u002Fdiv><\u002Fdetails>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <pre style=\"margin:0;padding:16px;border-top:1px solid var(--pui-border);font:13px/1.6 var(--pui-font-mono);overflow-x:auto\">&lt;<span style=\"color:var(--pui-theme-ink)\">details<\u002Fspan> class=\"pui-accordion-item\"&gt;\n  &lt;summary&gt;Billing address&lt;/summary&gt;<\u002Fpre>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Dark mode\" data-pui-mode=\"{{ s5.mode }}\" style=\"--pui-theme:{{ s5.theme }};position:relative;overflow:hidden;background:var(--pui-bg);color:var(--pui-text);border-top:1px solid var(--pui-border);transition:background-color .15s ease,color .15s ease\">\n  <div aria-hidden=\"true\" style=\"position:absolute;width:1100px;height:900px;right:-360px;top:-300px;pointer-events:none;background:radial-gradient(closest-side,color-mix(in oklab,var(--pui-theme) 18%,transparent),transparent)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1200px;margin:0 auto;padding:clamp(96px,12vw,160px) clamp(20px,5vw,40px);box-sizing:border-box\">\n    <h2 style=\"margin:0;font-size:clamp(36px,5vw,64px);line-height:1.02;font-weight:600;letter-spacing:-0.035em;max-width:20ch;text-wrap:balance\">One attribute for dark mode. One variable for your colour.<\u002Fh2>\n    <p style=\"margin:28px 0 0;font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:var(--pui-text-muted);max-width:56ch;text-wrap:pretty\">With no attribute, perfectui follows the operating system. Set data-pui-mode to choose, and --pui-theme to make every component yours.<\u002Fp>\n\n    <div class=\"pui-card\" style=\"margin-top:clamp(40px,6vw,72px);display:flex;flex-wrap:wrap\">\n      <div style=\"flex:0 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px;padding:24px;border-right:1px solid var(--pui-border);box-sizing:border-box\">\n        <label style=\"display:flex;align-items:center;gap:12px;cursor:pointer\"><input type=\"checkbox\" class=\"pui-switch\" checked=\"{{ s5.dark }}\" sc-camel-on-change=\"{{ s5.toggle }}\"><span>Dark<\u002Fspan><\u002Flabel>\n        <div style=\"display:flex;gap:12px;align-items:center\" role=\"radiogroup\" aria-label=\"Theme colour\">\n          <sc-for list=\"{{ s5.swatches }}\" as=\"w\" hint-placeholder-count=\"5\">\n            <input type=\"radio\" name=\"pui-s5-theme\" class=\"pui-radio\" aria-label=\"{{ w.label }}\" checked=\"{{ w.checked }}\" sc-camel-on-change=\"{{ w.pick }}\" style=\"--pui-color:{{ w.v }};width:22px;height:22px\">\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <pre style=\"margin:0;font:13px/1.8 var(--pui-font-mono);overflow-x:auto;padding-top:20px;border-top:1px solid var(--pui-border)\">&lt;html <span class=\"pui-soft pui-theme pui-rounded\" style=\"padding:1px 3px\">data-pui-mode=\"{{ s5.mode }}\"<\u002Fspan>&gt;\n<span class=\"pui-soft pui-theme pui-rounded\" style=\"padding:1px 3px\">--pui-theme: {{ s5.hex }};<\u002Fspan><\u002Fpre>\n        <a href=\"#\" class=\"pui-btn pui-link pui-theme\" style=\"padding-inline:0;align-self:flex-start;margin-top:auto\">Dark mode docs<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 480px;min-width:0;padding:clamp(16px,3vw,32px);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;background-image:radial-gradient(color-mix(in oklab,var(--pui-text) 14%,transparent) 1px,transparent 1.5px);background-size:16px 16px\">\n        <div class=\"pui-card\" style=\"flex:1 1 260px;min-width:0\">\n          <div class=\"pui-card-header\">New project<\u002Fdiv>\n          <div class=\"pui-card-content\">\n            <label class=\"pui-field-group\"><span>Name<\u002Fspan><input class=\"pui-input\" sc-camel-default-value=\"Perfect dashboard\"><\u002Flabel>\n            <label class=\"pui-field-group\"><span>Owner<\u002Fspan><input class=\"pui-input\" sc-camel-default-value=\"ana@perfectui.dev\"><small>You can change this later in Settings.<\u002Fsmall><\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;font-size:14px\"><input type=\"checkbox\" class=\"pui-switch\" sc-camel-default-checked=\"{{ true }}\">Notifications<\u002Flabel>\n            <div style=\"display:flex;gap:8px;justify-content:flex-end\"><button class=\"pui-btn pui-outline pui-surface\">Cancel<\u002Fbutton><button class=\"pui-btn pui-solid pui-theme\">Create<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:16px\">\n          <div class=\"pui-card pui-soft pui-theme\"><div class=\"pui-card-content\" style=\"gap:4px\"><strong style=\"font-weight:600\">Your trial ends in 3 days<\u002Fstrong><span>Add a payment method to keep your projects.<\u002Fspan><\u002Fdiv><\u002Fdiv
