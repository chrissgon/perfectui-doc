  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"83724475-79aa-4473-876a-860cd7de75e3\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n<\u002Fstyle>\n<style>/* Semantic tokens, base tokens and color mode (§4, §7). */\n@layer pui.tokens {\n  :root {\n    /* Default: follow the system. No attribute needed, no JS, no flash (§7.1). */\n    color-scheme: light dark;\n\n    /* Backgrounds: page, then two levels of emphasis. */\n    --pui-bg: light-dark(#fff, #000);\n    --pui-bg-muted: light-dark(#f3f4f6, #111827);\n    --pui-bg-emphasis: light-dark(#e5e7eb, #1f2937);\n\n    /* Text. Muted is a shade darker than v0's #6b7280 in light mode so that it\n       keeps 4.5:1 on --pui-bg-muted too, where the card header and the addon\n       put it; #6b7280 reached 4.39:1 there. */\n    --pui-text: light-dark(#000, #fff);\n    --pui-text-muted: light-dark(#676d7b, #9ca3af);\n\n    /* Border */\n    --pui-border: light-dark(#d1d5db, #374151);\n\n    /* States: v0 tone 600 in light, 500 in dark (muted keeps 500/400).\n\n       The label on a solid fill is always the page background, which is what\n       gives the palette its v0 look. In light mode that leaves theme, success\n       and warn between 3.19:1 and 3.50:1 on pui-solid — above the 3:1 floor\n       for interface elements, below the 4.5:1 of WCAG AA. Deliberate call by\n       the maintainer: appearance first, and the tokens are one override away\n       for anyone who needs AA. Everything else, including every text use and\n       the whole dark mode, stays at or above 4.5:1. */\n    --pui-theme: light-dark(#0092cd, #07b6f0);\n    --pui-success: light-dark(#16a34a, #22c55e);\n    --pui-warn: light-dark(#d97706, #f59e0b);\n    --pui-error: light-dark(#dc2626, #ef4444);\n    --pui-muted: light-dark(#6b7280, #9ca3af);\n\n    /* Non-color: one base per concept. Components scale these with calc()\n       multipliers (§4.1). Changing a base rescales the whole library. */\n    --pui-radius: 0.375rem;\n    --pui-space: 0.25rem;\n    --pui-font-size: 0.875rem;\n    --pui-border-width: 1px;\n  }\n\n  /* data-pui-mode on <html> is the switch; color-scheme does the work (§7.1). */\n  [data-pui-mode=\"light\"] {\n    color-scheme: light;\n  }\n\n  [data-pui-mode=\"dark\"] {\n    color-scheme: dark;\n  }\n}\n<\u002Fstyle>\n<style>/* Semantic aliases for design tools — the five Figma slots per role\n   (DESIGN-SYSTEM.md §6.1), derived from the library's base tokens exactly the\n   way css/styles.css derives them, so they follow light/dark and any\n   --pui-theme override. Plus the resolved size scale. Not in the npm package. */\n@layer pui.tokens {\n  :root {\n    --pui-theme-fill: var(--pui-theme);\n    --pui-theme-on-fill: var(--pui-bg);\n    --pui-theme-fill-hover: color-mix(in oklab, var(--pui-theme), var(--pui-text) 12%);\n    --pui-theme-edge: var(--pui-theme);\n    --pui-theme-ink: color-mix(in oklab, var(--pui-theme), var(--pui-text) 25%);\n    --pui-success-fill: var(--pui-success);\n    --pui-success-on-fill: var(--pui-bg);\n    --pui-success-fill-hover: color-mix(in oklab, var(--pui-success), var(--pui-text) 12%);\n    --pui-success-edge: var(--pui-success);\n    --pui-success-ink: color-mix(in oklab, var(--pui-success), var(--pui-text) 25%);\n    --pui-error-fill: var(--pui-error);\n    --pui-error-on-fill: var(--pui-bg);\n    --pui-error-fill-hover: color-mix(in oklab, var(--pui-error), var(--pui-text) 12%);\n    --pui-error-edge: var(--pui-error);\n    --pui-error-ink: color-mix(in oklab, var(--pui-error), var(--pui-text) 25%);\n    --pui-warn-fill: var(--pui-warn);\n    --pui-warn-on-fill: var(--pui-bg);\n    --pui-warn-fill-hover: color-mix(in oklab, var(--pui-warn), var(--pui-text) 12%);\n    --pui-warn-edge: var(--pui-warn);\n    --pui-warn-ink: color-mix(in oklab, var(--pui-warn), var(--pui-text) 25%);\n    --pui-muted-fill: var(--pui-muted);\n    --pui-muted-on-fill: var(--pui-bg);\n    --pui-muted-fill-hover: color-mix(in oklab, var(--pui-muted), var(--pui-text) 12%);\n    --pui-muted-edge: var(--pui-muted);\n    --pui-muted-ink: color-mix(in oklab, var(--pui-muted), var(--pui-text) 25%);\n    --pui-surface-fill: var(--pui-bg);\n    --pui-surface-on-fill: var(--pui-text);\n    --pui-surface-fill-hover: color-mix(in oklab, var(--pui-bg), var(--pui-text) 12%);\n    --pui-surface-edge: var(--pui-border);\n    --pui-surface-ink: var(--pui-text);\n    --pui-inverse-fill: var(--pui-text);\n    --pui-inverse-on-fill: var(--pui-bg);\n    --pui-inverse-fill-hover: color-mix(in oklab, var(--pui-text), var(--pui-bg) 12%);\n    --pui-inverse-edge: var(--pui-text);\n    --pui-inverse-ink: var(--pui-text);\n\n    /* Spacing: multiples of --pui-space (4px). Nothing uses a value outside this. */\n    --pui-space-0-5: calc(var(--pui-space) * 0.5);\n    --pui-space-1: var(--pui-space);\n    --pui-space-1-25: calc(var(--pui-space) * 1.25);\n    --pui-space-1-5: calc(var(--pui-space) * 1.5);\n    --pui-space-1-75: calc(var(--pui-space) * 1.75);\n    --pui-space-2: calc(var(--pui-space) * 2);\n    --pui-space-2-5: calc(var(--pui-space) * 2.5);\n    --pui-space-3: calc(var(--pui-space) * 3);\n    --pui-space-4: calc(var(--pui-space) * 4);\n    --pui-space-6: calc(var(--pui-space) * 6);\n    --pui-space-7: calc(var(--pui-space) * 7);\n    --pui-space-8: calc(var(--pui-space) * 8);\n\n    /* Radii */\n    --pui-radius-sm: calc(var(--pui-radius) * 0.5);\n    --pui-radius-inner: calc(var(--pui-radius) - var(--pui-border-width));\n    --pui-radius-lg: calc(var(--pui-radius) * 1.5);\n    --pui-radius-full: 9999px;\n\n    /* Type. The library sets no family and no body weight; these are the\n       page conventions of the repo's own preview (tests/manual/preview.html). */\n    --pui-font-sans: system-ui, sans-serif;\n    --pui-font-mono: ui-monospace, monospace;\n    --pui-font-size-small: calc(var(--pui-font-size) * 0.857);\n    --pui-line-height: 1.25;\n    --pui-font-weight-strong: 600;\n\n    /* Motion */\n    --pui-duration: 0.15s; /* @kind other */\n    --pui-easing: ease; /* @kind other */\n\n    /* Semantic surface aliases */\n    --pui-surface-page: var(--pui-bg);\n    --pui-surface-card: var(--pui-bg);\n    --pui-surface-card-header: var(--pui-bg-muted);\n    --pui-text-body: var(--pui-text);\n    --pui-text-secondary: var(--pui-text-muted);\n    --pui-backdrop: rgb(0 0 0 / 50%);\n  }\n}\n<\u002Fstyle>\n<style>/* Style classes. They only read the contract variables (§3.1); no sizes.\n\n   The mixes interpolate in oklab, not oklch. Both describe the same space, but\n   oklch carries a hue component, and mixing a near-neutral color with white or\n   black makes Chrome serialize that hue as `none` — which then paints as hue 0.\n   The muted grey came out pink. oklab has no hue to lose, and for a saturated\n   color the two are identical.\n\n   Every value below is derived, so a new color never needs a new rule here.\n   Contrast was measured for all 7 colors x 4 styles x hover in both modes:\n   nothing drops below 4.5:1. Two derivations carry that:\n   - hover shades the color toward --pui-shade, which by default is the page\n     text, so the fill moves away from its label;\n   - the non-filled styles move the color 25% toward the page text before using\n     it as text, which is the minimum that keeps every color readable on the\n     page and on the tint of .pui-soft. */\n@layer pui.styles {\n  :where(.pui-solid, .pui-soft, .pui-outline, .pui-link) {\n    transition:\n      background-color 0.15s ease,\n      border-color 0.15s ease,\n      color 0.15s ease;\n\n    /* Links, buttons and svg do not inherit color on their own. */\n    > * {\n      color: inherit;\n    }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    :where(.pui-solid, .pui-soft, .pui-outline, .pui-link) {\n      transition: none;\n    }\n  }\n\n  /* Text of the three non-filled styles. Moving toward the page text is what\n     makes the fill color readable as text: the solid fill trades contrast for\n     appearance, text does not. */\n  :where(.pui-soft, .pui-outline, .pui-link) {\n    color: var(\n      --pui-ink,\n      color-mix(in oklab, var(--pui-color), var(--pui-text) 25%)\n    );\n  }\n\n  .pui-solid {\n    background-color: var(--pui-color);\n    border-color: var(--pui-edge, var(--pui-color));\n    color: var(--pui-on-color);\n\n    &:hover {\n      background-color: color-mix(\n        in oklab,\n        var(--pui-color),\n        var(--pui-shade, var(--pui-text)) 12%\n      );\n    }\n  }\n\n  .pui-soft {\n    background-color: color-mix(in oklab, var(--pui-color) 15%, transparent);\n    border-color: transparent;\n\n    &:hover {\n      background-color: color-mix(in oklab, var(--pui-color) 22%, transparent);\n    }\n  }\n\n  .pui-outline {\n    background-color: transparent;\n    border-color: var(--pui-edge, var(--pui-color));\n\n    &:hover {\n      background-color: color-mix(in oklab, var(--pui-color) 10%, transparent);\n    }\n  }\n\n  .pui-link {\n    background-color: transparent;\n    border-color: transparent;\n\n    &:hover {\n      text-decoration: underline;\n      text-underline-offset: 0.3rem;\n    }\n  }\n}\n<\u002Fstyle>\n<style>/* Color classes. They only set the contract variables (§3.1); no painting. */\n@layer pui.colors {\n  .pui-theme {\n    --pui-color: var(--pui-theme);\n    --pui-on-color: var(--pui-bg);\n  }\n\n  .pui-success {\n    --pui-color: var(--pui-success);\n    --pui-on-color: var(--pui-bg);\n  }\n\n  .pui-error {\n    --pui-color: var(--pui-error);\n    --pui-on-color: var(--pui-bg);\n  }\n\n  .pui-warn {\n    --pui-color: var(--pui-warn);\n    --pui-on-color: var(--pui-bg);\n  }\n\n  .pui-muted {\n    --pui-color: var(--pui-muted);\n    --pui-on-color: var(--pui-bg);\n  }\n\n  /* Aligned with the page background. Its color *is* --pui-bg, so it also has\n     to say which ink to use when the color is not the fill. */\n  .pui-surface {\n    --pui-color: var(--pui-bg);\n    --pui-on-color: var(--pui-text);\n    --pui-edge: var(--pui-border);\n    --pui-ink: var(--pui-text);\n  }\n\n  /* Opposite of the page background. Its color *is* --pui-text, so shading\n     toward the text would be a no-op: it shades toward the background. */\n  .pui-inverse {\n    --pui-color: var(--pui-text);\n    --pui-on-color: var(--pui-bg);\n    --pui-shade: var(--pui-bg);\n  }\n}\n<\u002Fstyle>\n<style>/* States. Last layer, so these win over shape, style and color rules without\n   any specificity tricks. Scoped to elements that carry a pui- class, never to\n   bare elements (hard rule 5). */\n@layer pui.states {\n  :where([class^=\"pui-\"], [class*=\" pui-\"]) {\n    &:disabled,\n    &[disabled],\n    &[aria-disabled=\"true\"] {\n      cursor: not-allowed;\n      opacity: 0.5;\n    }\n\n    /* Keyboard focus only. The ring takes the element's own color when it has\n       one, so an error control focuses red. */\n    &:focus-visible {\n      outline: 2px solid var(--pui-color, var(--pui-theme));\n      outline-offset: 2px;\n    }\n\n    /* Invalid re-points the contract to the error color, so whatever style is\n       applied turns red without a dedicated class (§6.1). */\n    &[aria-invalid=\"true\"] {\n      --pui-color: var(--pui-error);\n      --pui-edge: var(--pui-error);\n      --pui-ink: var(--pui-error);\n    }\n  }\n}\n<\u002Fstyle>\n<style>/* The only helper classes the library ships. Allowed because they are used\n   together with components (§6): a pill-shaped chip or badge, or squaring a\n   corner back off.\n\n   They need their own layer: a helper and a component class have the same\n   specificity, so inside pui.components the component would win or lose by\n   source order alone, which changes with the import order of the user. */\n@layer pui.utilities {\n  .pui-rounded {\n    border-radius: var(--pui-radius);\n  }\n\n  .pui-rounded-full {\n    border-radius: 9999px;\n  }\n}\n<\u002Fstyle>\n<style>/* Button shape. Colors come from a style class plus a color class (§3).\n   Requires core.css. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    gap: var(--pui-space);\n    padding: calc(var(--pui-space) * 2) calc(var(--pui-space) * 4);\n    border: var(--pui-border-width) solid transparent;\n    border-radius: var(--pui-radius);\n    font: inherit;\n    font-size: var(--pui-font-size);\n    line-height: 1.25;\n    white-space: nowrap;\n    cursor: pointer;\n    user-select: none;\n\n    /* Normalize the two elements this class is used on: <button> brings UA\n       chrome, <a> brings an underline. Style classes paint over both. */\n    background-color: transparent;\n    color: inherit;\n    text-decoration: none;\n  }\n}\n<\u002Fstyle>\n<style>/* Chip shape: one step smaller than pui-btn, one step larger than pui-badge\n   (§6). Requires core.css. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-chip {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--pui-space);\n    padding: calc(var(--pui-space) * 1) calc(var(--pui-space) * 3);\n    border: var(--pui-border-width) solid transparent;\n    border-radius: var(--pui-radius);\n    font: inherit;\n    font-size: var(--pui-font-size);\n    line-height: 1.25;\n    white-space: nowrap;\n  }\n}\n<\u002Fstyle>\n<style>/* Badge shape: the smallest of the three (§6). Requires core.css. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: var(--pui-space);\n    padding: calc(var(--pui-space) * 0.5) calc(var(--pui-space) * 1.75);\n    border: var(--pui-border-width) solid transparent;\n    border-radius: var(--pui-radius);\n    font: inherit;\n    font-size: calc(var(--pui-font-size) * 0.857);\n    line-height: 1.25;\n    white-space: nowrap;\n  }\n}\n<\u002Fstyle>\n<style>/* Card shape. A card is a *surface*: it uses the page tokens directly instead\n   of the color contract, so it is usable with no extra classes. A style class\n   still wins over it, because pui.styles comes after pui.components.\n   Requires core.css. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-card {\n    overflow: hidden;\n    /* Without this a card is transparent, which only looks right while it sits\n       directly on the page. Over a modal backdrop, or on a tinted section, the\n       page shows through it. */\n    background-color: var(--pui-bg);\n    border: var(--pui-border-width) solid var(--pui-border);\n    border-radius: calc(var(--pui-radius) * 1.5);\n    font-size: var(--pui-font-size);\n  }\n\n  .pui-card-header {\n    padding: calc(var(--pui-space) * 2) calc(var(--pui-space) * 4);\n    background-color: var(--pui-bg-muted);\n    color: var(--pui-text-muted);\n  }\n\n  .pui-card-content {\n    display: grid;\n    gap: calc(var(--pui-space) * 3);\n    padding: calc(var(--pui-space) * 4);\n  }\n}\n<\u002Fstyle>\n<style>/* Form controls. Requires core.css.\n\n   Two things are worth knowing before changing this file:\n\n   - Borders read `var(--pui-edge, var(--pui-border))`. That is what makes\n     aria-invalid work with no extra class: pui.states points --pui-edge at the\n     error color, and every control here picks it up.\n   - The select arrow, the radio dot and the switch knob are drawn with\n     gradients rather than data URIs, because a color baked into a data URI\n     cannot follow the color mode. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  /* --- field group (§6.1) ------------------------------------------------\n     Label and message are real elements, matched by tag so the user writes no\n     extra classes: <span> is the label, <small> is the message. */\n  .pui-field-group {\n    display: grid;\n    gap: var(--pui-space);\n    font-size: var(--pui-font-size);\n\n    & > span {\n      font-size: calc(var(--pui-font-size) * 0.857);\n    }\n\n    & > small {\n      font-size: calc(var(--pui-font-size) * 0.857);\n      color: var(--pui-text-muted);\n    }\n  }\n\n  /* --- text controls ----------------------------------------------------- */\n  .pui-input {\n    appearance: none;\n    min-width: 0;\n    padding: calc(var(--pui-space) * 1.5) calc(var(--pui-space) * 3);\n    border: var(--pui-border-width) solid var(--pui-edge, var(--pui-border));\n    border-radius: var(--pui-radius);\n    background-color: transparent;\n    color: inherit;\n    font: inherit;\n    font-size: var(--pui-font-size);\n    line-height: 1.25;\n\n    &::placeholder {\n      color: var(--pui-text-muted);\n    }\n  }\n\n  textarea.pui-input {\n    resize: vertical;\n  }\n\n  /* The arrow is drawn in currentColor, so it follows the text color in both\n     modes without shipping an image. One conic gradient rather than two linear\n     ones: two halves have to meet on a diagonal, and at this size they miss by\n     a subpixel and the tip comes out clipped. Its size matches the accordion\n     chevron, which is built from borders. */\n  select.pui-input {\n    padding-inline-end: calc(var(--pui-space) * 7);\n    background-repeat: no-repeat;\n    background-image: conic-gradient(\n      from 315deg at 50% 100%,\n      currentColor 0 90deg,\n      transparent 0\n    );\n    background-size: calc(var(--pui-font-size) * 0.6)\n      calc(var(--pui-font-size) * 0.3);\n    background-position: right calc(var(--pui-space) * 3) center;\n  }\n\n  /* --- input group + addon ----------------------------------------------\n     The group owns the border and the radius; the controls inside drop theirs\n     so the whole thing reads as one field. */\n  /* The corners are handed to the children rather than clipped with\n     overflow: hidden. Clipping would also cut the focus ring of a control\n     inside the group, and a ring drawn within the control instead disappears\n     against a solid fill. */\n  .pui-input-group {\n    display: flex;\n    align-items: stretch;\n    border: var(--pui-border-width) solid var(--pui-edge, var(--pui-border));\n    border-radius: var(--pui-radius);\n    font-size: var(--pui-font-size);\n\n    & > .pui-input {\n      flex: 1;\n    }\n\n    /* Anything dropped into the group gives up its own frame: the group is one\n       field with one border and one radius. */\n    & > * {\n      border: none;\n      border-radius: 0;\n    }\n\n    & > :first-child {\n      border-start-start-radius: calc(\n        var(--pui-radius) - var(--pui-border-width)\n      );\n      border-end-start-radius: calc(\n        var(--pui-radius) - var(--pui-border-width)\n      );\n    }\n\n    & > :last-child {\n      border-start-end-radius: calc(\n        var(--pui-radius) - var(--pui-border-width)\n      );\n      border-end-end-radius: calc(var(--pui-radius) - var(--pui-border-width));\n    }\n  }\n\n  .pui-addon {\n    display: flex;\n    align-items: center;\n    padding-inline: calc(var(--pui-space) * 3);\n    background-color: var(--pui-bg-muted);\n    color: var(--pui-text-muted);\n    white-space: nowrap;\n  }\n\n  .pui-input-group > .pui-addon:first-child {\n    border-inline-end: var(--pui-border-width) solid var(--pui-border);\n  }\n\n  .pui-input-group > .pui-addon:last-child {\n    border-inline-start: var(--pui-border-width) solid var(--pui-border);\n  }\n\n  /* --- checkbox, radio, switch ------------------------------------------- */\n  .pui-checkbox,\n  .pui-radio,\n  .pui-switch {\n    appearance: none;\n    /* These are the only controls with a fixed size, so they cannot rely on\n       the page's box-sizing. */\n    box-sizing: border-box;\n    flex: none;\n    margin: 0;\n    border: var(--pui-border-width) solid var(--pui-edge, var(--pui-border));\n    background-color: transparent;\n    background-repeat: no-repeat;\n    cursor: pointer;\n  }\n\n  .pui-checkbox,\n  .pui-radio {\n    width: calc(var(--pui-font-size) * 1.143);\n    height: calc(var(--pui-font-size) * 1.143);\n    background-position: center;\n  }\n\n  .pui-checkbox {\n    border-radius: calc(var(--pui-radius) * 0.5);\n  }\n\n  .pui-radio {\n    border-radius: 9999px;\n  }\n\n  /* One rule for every checked control: the fill is the element's own color,\n     so <input class=\"pui-checkbox pui-success\"> is green with no extra work. */\n  :is(.pui-checkbox, .pui-radio, .pui-switch):is(:checked, :indeterminate) {\n    background-color: var(--pui-color, var(--pui-theme));\n    border-color: var(--pui-color, var(--pui-theme));\n  }\n\n  .pui-checkbox:checked {\n    background-image: url(\"data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='m6 10 3 3 6-6'/%3e%3c/svg%3e\");\n    background-size: 100%;\n  }\n\n  .pui-checkbox:indeterminate {\n    background-image: linear-gradient(#fff, #fff);\n    background-size: 55% calc(var(--pui-border-width) * 2);\n    background-position: center;\n  }\n\n  .pui-radio:checked {\n    background-image: radial-gradient(circle, #fff 0 34%, transparent 35%);\n    background-size: 100%;\n  }\n\n  .pui-switch {\n    width: calc(var(--pui-font-size) * 2.286);\n    height: calc(var(--pui-font-size) * 1.143);\n    border-radius: 9999px;\n    background-image: radial-gradient(\n      circle,\n      var(--pui-border) 0 42%,\n      transparent 43%\n    );\n    background-size: calc(var(--pui-font-size) * 1.143) 100%;\n    background-position: left center;\n    transition:\n      background-color 0.15s ease,\n      background-position 0.15s ease,\n      border-color 0.15s ease;\n\n    &:checked {\n      background-image: radial-gradient(circle, #fff 0 42%, transparent 43%);\n      background-position: right center;\n    }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .pui-switch {\n      transition: none;\n    }\n  }\n}\n\n@layer pui.states {\n  /* An input group is one field, so the group draws the ring and the control\n     inside does not. */\n  .pui-input-group > .pui-input:focus-visible {\n    outline: none;\n  }\n\n  /* Scoped to the field itself: a button inside the group keeps its own ring\n     instead of lighting up the whole field. */\n  .pui-input-group:has(> .pui-input:focus-visible) {\n    outline: 2px solid var(--pui-color, var(--pui-theme));\n    outline-offset: 2px;\n  }\n\n  /* The invalid control colors its own border through --pui-edge; the group's\n     message follows it (§6.1). */\n  .pui-field-group:has([aria-invalid=\"true\"]) > small {\n    color: var(--pui-error);\n  }\n}\n<\u002Fstyle>\n<style>/* Group: joins children into one control, removing the inner corners and the\n   doubled border between them. Requires core.css.\n\n   Children need no class of their own: v0's `group-item` (and its\n   `[class*=\"item\"]` escape hatch) is gone. Borders are overlapped with a\n   negative margin rather than removed, so pui-outline still has a border to\n   paint on every child. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-group-row,\n  .pui-group-col,\n  .pui-group-responsive {\n    display: flex;\n  }\n\n  .pui-group-col {\n    flex-direction: column;\n  }\n\n  /* --- row ---------------------------------------------------------------- */\n  :is(.pui-group-row, .pui-group-responsive) > * {\n    border-radius: 0;\n\n    &:first-child {\n      border-start-start-radius: var(--pui-radius);\n      border-end-start-radius: var(--pui-radius);\n    }\n\n    &:last-child {\n      border-start-end-radius: var(--pui-radius);\n      border-end-end-radius: var(--pui-radius);\n    }\n\n    & + * {\n      margin-inline-start: calc(var(--pui-border-width) * -1);\n    }\n  }\n\n  /* --- column ------------------------------------------------------------- */\n  .pui-group-col > * {\n    border-radius: 0;\n\n    &:first-child {\n      border-start-start-radius: var(--pui-radius);\n      border-start-end-radius: var(--pui-radius);\n    }\n\n    &:last-child {\n      border-end-start-radius: var(--pui-radius);\n      border-end-end-radius: var(--pui-radius);\n    }\n\n    & + * {\n      margin-block-start: calc(var(--pui-border-width) * -1);\n    }\n  }\n\n  /* --- responsive ---------------------------------------------------------\n     The one hardcoded breakpoint in the library: a media query cannot read a\n     custom property. Same value as v0. */\n  @media (width < 1024px) {\n    .pui-group-responsive {\n      flex-direction: column;\n    }\n\n    .pui-group-responsive > * {\n      &:first-child {\n        border-radius: var(--pui-radius) var(--pui-radius) 0 0;\n      }\n\n      &:last-child {\n        border-radius: 0 0 var(--pui-radius) var(--pui-radius);\n      }\n\n      & + * {\n        margin-inline-start: 0;\n        margin-block-start: calc(var(--pui-border-width) * -1);\n      }\n    }\n  }\n\n  /* A focused child is raised so its ring is not clipped by the neighbour that\n     overlaps it. Hover is deliberately not in this list: raising on hover flips\n     which element owns the shared one-pixel edge, and the border appears to\n     move as the pointer crosses the group. */\n  :is(.pui-group-row, .pui-group-col, .pui-group-responsive)\n    > *:is(:focus-visible, :focus-within) {\n    position: relative;\n    z-index: 1;\n  }\n}\n<\u002Fstyle>\n<style>/* Accordion. Exclusive opening is native: give the items the same `name` on\n   <details> and the browser closes the others. Zero JS. Requires core.css.\n\n   Consecutive items read as one block: they share the 1px line between them,\n   and only the outer corners stay round. Spacing them apart instead is two\n   declarations of author CSS, documented in docs/accordion.md. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-accordion {\n    display: grid;\n    font-size: var(--pui-font-size);\n  }\n\n  /* No overflow clipping: it would cut the summary's focus ring in half. */\n  .pui-accordion-item {\n    border: var(--pui-border-width) solid var(--pui-edge, var(--pui-border));\n    /* Squared by default, rounded again at the two ends below, so a lone item\n       still gets all four corners: it is both the first child and the last. */\n    border-radius: 0;\n\n    /* Same joining as pui-group-col, on the accordion's own children so that\n       importing this file alone is enough. The borders overlap rather than one\n       of them being removed, which keeps a recolored item's own border whole. */\n    & + .pui-accordion-item {\n      margin-block-start: calc(var(--pui-border-width) * -1);\n    }\n\n    &:first-child {\n      border-start-start-radius: var(--pui-radius);\n      border-start-end-radius: var(--pui-radius);\n    }\n\n    &:last-child {\n      border-end-start-radius: var(--pui-radius);\n      border-end-end-radius: var(--pui-radius);\n    }\n\n    & > summary {\n      display: flex;\n      align-items: center;\n      justify-content: space-between;\n      gap: calc(var(--pui-space) * 2);\n      padding: calc(var(--pui-space) * 2) calc(var(--pui-space) * 4);\n      /* Nothing is painted with this: it is what shapes the focus ring, which\n         follows the radius of the element it surrounds. One border width is\n         taken off so the ring's corner ends up concentric with the item's, and\n         the corners it takes are the ones its item kept. `inherit` cannot be\n         used — a <summary> is slotted into the shadow root of <details>, so it\n         inherits from that slot, not from the item. */\n      border-radius: 0;\n      cursor: pointer;\n      user-select: none;\n      /* Hide the default marker: `list-style` covers Chrome and Firefox, the\n         pseudo-element covers Safari. */\n      list-style: none;\n\n      &::-webkit-details-marker {\n        display: none;\n      }\n\n      /* Chevron drawn with borders, so it follows the text color. The bottom\n         border is zero on purpose: that makes the element's box exactly the\n         triangle, so rotating it 180deg spins it in place instead of swinging\n         it around a box that is twice as tall. */\n      &::after {\n        content: \"\";\n        flex: none;\n        width: 0;\n        height: 0;\n        border-style: solid;\n        border-width: calc(var(--pui-font-size) * 0.3)\n          calc(var(--pui-font-size) * 0.3) 0;\n        border-color: currentColor transparent transparent;\n        transition: rotate 0.15s ease;\n      }\n    }\n\n    &:first-child > summary {\n      border-start-start-radius: calc(\n        var(--pui-radius) - var(--pui-border-width)\n      );\n      border-start-end-radius: calc(\n        var(--pui-radius) - var(--pui-border-width)\n      );\n    }\n\n    /* Only while closed: once the item is open the panel owns the bottom of it\n       and the summary's lower corners are in the middle of the block. */\n    &:last-child:not([open]) > summary {\n      border-end-start-radius: calc(\n        var(--pui-radius) - var(--pui-border-width)\n      );\n      border-end-end-radius: calc(var(--pui-radius) - var(--pui-border-width));\n    }\n\n    &[open] > summary::after {\n      rotate: 180deg;\n    }\n\n    /* Bring your own icon: put pui-accordion-icon inside the summary and the\n       drawn chevron steps aside. Rotation and placement stay ours. */\n    & > summary:has(.pui-accordion-icon)::after {\n      content: none;\n    }\n\n    & > summary > .pui-accordion-icon {\n      flex: none;\n      margin-inline-start: auto;\n      transition: rotate 0.15s ease;\n    }\n\n    &[open] > summary > .pui-accordion-icon {\n      rotate: 180deg;\n    }\n\n    & > :not(summary) {\n      padding: 0 calc(var(--pui-space) * 4) calc(var(--pui-space) * 4);\n    }\n  }\n\n  /* The third modifier in the library, and it earns its place the same way the\n     other two do: `[open]` is a structural selector, so no combination of\n     classes on the item can say \"only while this one is expanded\" (§6).\n     It is v0's `accordion-accented`, down to the tone — a card header's, not\n     --pui-bg-emphasis, which stays free for whoever needs a third level. */\n  .pui-accordion.pui-highlighted > .pui-accordion-item[open] {\n    background-color: var(--pui-bg-muted);\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    .pui-accordion-item > summary::after,\n    .pui-accordion-item > summary > .pui-accordion-icon {\n      transition: none;\n    }\n  }\n}\n\n@layer pui.states {\n  /* The item that owns the focus is raised, or the ring is painted under the\n     neighbour that overlaps it by a border width. Same reason as in a group,\n     and hover is left out of it there for a reason too. */\n  .pui-accordion-item:has(> summary:focus-visible) {\n    position: relative;\n    z-index: 1;\n  }\n\n  /* The class is on the <details>, not on the <summary>, so the library's own\n     focus rule never reaches the element the user actually focuses, and the\n     browser's default ring shows through instead. */\n  .pui-accordion-item > summary:focus-visible {\n    outline: 2px solid var(--pui-color, var(--pui-theme));\n    /* The summary sits inside the item's border, so the offset carries that\n       border width as well. Without it the ring hugs this component one pixel\n       tighter than every other one. */\n    outline-offset: calc(2px + var(--pui-border-width));\n  }\n}\n<\u002Fstyle>\n<style>/* Modal. The behavior is the native <dialog>: `commandfor` opens it and\n   `closedby=\"any\"` gives it light dismiss, both without JS. Requires core.css.\n\n   The dialog itself is only a frame — put a pui-card inside it for the\n   surface, so a modal is composed from pieces that already exist. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-modal {\n    max-width: min(32rem, calc(100vw - var(--pui-space) * 8));\n    max-height: calc(100dvh - var(--pui-space) * 8);\n    /* Without this the content spills past the max height and cannot be\n       reached: a <dialog> does not scroll on its own. */\n    overflow: auto;\n    padding: 0;\n    border: none;\n    background: transparent;\n    color: inherit;\n    font-size: var(--pui-font-size);\n\n    &::backdrop {\n      background-color: rgb(0 0 0 / 50%);\n    }\n  }\n}\n<\u002Fstyle>\n<style>/* Dropdown. The behavior is the native popover API: `popovertarget` on the\n   trigger, `popover` on the panel. Requires core.css.\n\n   Placement uses CSS anchor positioning, which a popover invoked by\n   `popovertarget` gets for free through its implicit anchor. It is guarded by\n   @supports so that browsers without it keep the centered UA position until\n   the Phase 5 fallback positions the panel itself. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-dropdown {\n    /* min-width below matches the anchor's width, which only lands exactly\n       with border-box: otherwise the padding and border are added on top. */\n    box-sizing: border-box;\n    width: max-content;\n    margin: 0;\n    padding: var(--pui-space);\n    border: var(--pui-border-width) solid var(--pui-border);\n    border-radius: var(--pui-radius);\n    background-color: var(--pui-bg);\n    color: inherit;\n    font-size: var(--pui-font-size);\n  }\n\n  @supports (position-area: block-end) {\n    .pui-dropdown {\n      position: absolute;\n      inset: auto;\n      margin: 0;\n      position-area: block-end span-inline-end;\n      position-try-fallbacks: flip-block, flip-inline;\n      margin-block-start: var(--pui-space);\n      min-width: anchor-size(inline);\n    }\n\n    /* Directions. The gap always sits on the side facing the trigger, and the\n       flip goes back to where the panel came from. */\n    .pui-dropdown.pui-top {\n      position-area: block-start span-inline-end;\n      position-try-fallbacks: flip-block;\n      margin: 0 0 var(--pui-space);\n    }\n\n    .pui-dropdown.pui-start {\n      position-area: inline-start span-block-end;\n      position-try-fallbacks: flip-inline;\n      margin: 0 var(--pui-space) 0 0;\n      min-width: 0;\n    }\n\n    .pui-dropdown.pui-end {\n      position-area: inline-end span-block-end;\n      position-try-fallbacks: flip-inline;\n      margin: 0 0 0 var(--pui-space);\n      min-width: 0;\n    }\n\n    /* Alignment along the other axis, for the panel that opens above or below.\n       The default lines the panel up with the trigger's starting edge, which\n       is what a menu under a button wants; a menu at the end of a header wants\n       the opposite. */\n    .pui-dropdown.pui-align-center {\n      position-area: block-end;\n    }\n\n    .pui-dropdown.pui-align-end {\n      position-area: block-end span-inline-start;\n    }\n\n    .pui-dropdown.pui-top.pui-align-center {\n      position-area: block-start;\n    }\n\n    .pui-dropdown.pui-top.pui-align-end {\n      position-area: block-start span-inline-start;\n    }\n  }\n}\n<\u002Fstyle>\n<style>/* Tooltip. The behavior is native: `interestfor` on the trigger shows it on\n   hover, focus and long press, and `popover=\"hint\"` lets it appear without\n   closing an open menu. Requires core.css.\n\n   Both are Chromium-only today, so the Phase 5 fallbacks matter here more than\n   anywhere else. Where `popover=\"hint\"` is unknown the attribute falls back to\n   `auto`, which still works. */\n/* Cascade layer order. Must be the first rule of every entry file. See ARCHITECTURE.md §5. */\n@layer pui.tokens, pui.components, pui.utilities, pui.styles, pui.colors,\n  pui.states;\n\n\n@layer pui.components {\n  .pui-tooltip {\n    width: max-content;\n    max-width: 20rem;\n    margin: 0;\n    padding: calc(var(--pui-space) * 1.25) calc(var(--pui-space) * 2.5);\n    border: var(--pui-border-width) solid var(--pui-border);\n    border-radius: var(--pui-radius);\n    background-color: var(--pui-bg);\n    color: inherit;\n    font-size: calc(var(--pui-font-size) * 0.857);\n    /* A tooltip is never a pointer target. */\n    pointer-events: none;\n  }\n\n  @supports (position-area: block-start) {\n    .pui-tooltip {\n      position: absolute;\n      inset: auto;\n      margin: 0;\n      position-area: block-start;\n      position-try-fallbacks: flip-block;\n      margin-block-end: var(--pui-space);\n    }\n\n    /* Directions, centered on the trigger on the other axis. */\n    .pui-tooltip.pui-bottom {\n      position-area: block-end;\n      margin: var(--pui-space) 0 0;\n    }\n\n    .pui-tooltip.pui-start {\n      position-area: inline-start;\n      position-try-fallbacks: flip-inline;\n      margin: 0 var(--pui-space) 0 0;\n    }\n\n    .pui-tooltip.pui-end {\n      position-area: inline-end;\n      position-try-fallbacks: flip-inline;\n      margin: 0 0 0 var(--pui-space);\n    }\n  }\n}\n<\u002Fstyle>\n<style>/* Icons. Not part of the Perfect UI library (it ships none) — this is the\n   author stylesheet recipe from DESIGN-SYSTEM.md §1.6: one Lucide SVG per icon,\n   used as a CSS mask and painted with currentColor. */\n.icon{display:inline-block;flex:none;width:16px;height:16px;vertical-align:-0.125em;background-color:currentColor;mask-position:center;mask-size:contain;mask-repeat:no-repeat;-webkit-mask-position:center;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat}\n.icon-bell-ring{mask-image:url(\"4006153d-4dd7-4dad-9706-1c90fd030294\");-webkit-mask-image:url(\"4006153d-4dd7-4dad-9706-1c90fd030294\")}\n.icon-bell{mask-image:url(\"3bf55344-da40-42c4-96a7-6c8c75bee592\");-webkit-mask-image:url(\"3bf55344-da40-42c4-96a7-6c8c75bee592\")}\n.icon-bold{mask-image:url(\"a9134604-32c2-4fcd-847f-d5fe9da9f753\");-webkit-mask-image:url(\"a9134604-32c2-4fcd-847f-d5fe9da9f753\")}\n.icon-calendar{mask-image:url(\"17c56a9a-9c89-402f-93f2-600d1c7cc091\");-webkit-mask-image:url(\"17c56a9a-9c89-402f-93f2-600d1c7cc091\")}\n.icon-check{mask-image:url(\"03a15fb0-2c5b-4ef0-be79-43c745621926\");-webkit-mask-image:url(\"03a15fb0-2c5b-4ef0-be79-43c745621926\")}\n.icon-chevron-down{mask-image:url(\"b2ee17d1-f21d-43cc-b313-5dc0ef06ce12\");-webkit-mask-image:url(\"b2ee17d1-f21d-43cc-b313-5dc0ef06ce12\")}\n.icon-circle-alert{mask-image:url(\"b9908162-f7d3-4193-b8df-d85a31a086ac\");-webkit-mask-image:url(\"b9908162-f7d3-4193-b8df-d85a31a086ac\")}\n.icon-circle-check{mask-image:url(\"f1fcaa7f-2428-4878-9f94-e180df7012a2\");-webkit-mask-image:url(\"f1fcaa7f-2428-4878-9f94-e180df7012a2\")}\n.icon-circle-user{mask-image:url(\"206b4f6a-725e-4d31-9e7a-dc :9999px}\n@keyframes pui-caret{0%,49%{opacity:1}50%,100%{opacity:0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"pui-export-root\" style=\"background:var(--pui-bg);color:var(--pui-text);font:16px/1.5 var(--pui-font-sans);min-height:100vh;overflow-x:clip\">\n\n<header style=\"position:sticky;top:0;z-index:10;background:var(--pui-bg);border-bottom:1px solid var(--pui-border)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 clamp(12px,4vw,40px);height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n    <a href=\"#\" class=\"pui-btn pui-link pui-surface\" style=\"padding-inline:4px\" aria-label=\"Perfect UI home\">\n      <span style=\"display:flex;align-items:center;gap:10px\">\n        <img src=\"c7baee74-55c6-44c4-9538-7c9cb83f5461\" alt=\"\" style=\"height:22px;filter:var(--logo-filter)\">\n        <img src=\"b92e1127-5d29-44a7-a587-6c2ebf15a48f\" alt=\"Perfect UI\" style=\"height:16px;filter:var(--logo-filter)\">\n      <\u002Fspan>\n    <\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:4px\">\n      <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <a href=\"#\" class=\"pui-btn pui-link pui-surface\">Docs<\u002Fa>\n        <button class=\"pui-btn pui-link pui-surface\" aria-label=\"Search\" style=\"padding-inline:10px\"><span class=\"icon icon-search\"><\u002Fspan><\u002Fbutton>\n        <span class=\"pui-badge pui-soft pui-theme\" style=\"margin-inline:6px\">1.0<\u002Fspan>\n        <span style=\"width:1px;height:20px;background:var(--pui-border);margin-inline:6px\"><\u002Fspan>\n      <\u002Fsc-if>\n      <button class=\"pui-btn pui-link pui-surface\" aria-label=\"{{ modeLabel }}\" sc-camel-on-click=\"{{ toggleMode }}\" style=\"padding-inline:10px\">\n        <sc-if value=\"{{ isLight }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"icon icon-moon\"><\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ isDark }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"icon icon-sun x;flex-direction:column;gap:4px\">\n            <span style=\"font-size:18px;font-weight:600;letter-spacing:-0.01em;padding-left:4px\">Three classes, no framework,<\u002Fspan>\n            <span style=\"font-size:88px;line-height:0.82;font-weight:600;letter-spacing:-0.065em;white-space:nowrap\">3.2 <span style=\"color:var(--pui-theme)\">kB<\u002Fspan>.<\u002Fspan>\n          <\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ leadHeadline }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:clamp(22px,2.4vw,28px);line-height:1.2;font-weight:600;letter-spacing:-0.02em\">Three classes, no framework, <span style=\"color:var(--pui-theme-ink)\">3.2 kB<\u002Fspan>.<\u002Fp>\n        <\u002Fsc-if>\n        <p style=\"margin:0;font-size:clamp(16px,1.6vw,18px);line-height:1.55;color:var(--pui-text-muted);max-width:46ch;text-wrap:pretty\">A CSS and JavaScript library with no reset, no font, no runtime dependencies and no rule outside a pui- class; the browser does the work.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:16px;align-items:flex-start\">\n          <div class=\"pui-input-group\" style=\"font-family:var(--pui-font-mono);width:380px;max-width:100%;box-sizing:border-box;background:var(--pui-bg)\">\n            <span class=\"pui-addon\">$<\u002Fspan>\n            <input class=\"pui-input\" sc-camel-read-only=\"{{ true }}\" value=\"npm i @chrissgon/perfectui\" aria-label=\"Install command\">\n            <sc-if value=\"{{ cp.heroOff }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"pui-btn pui-link pui-surface\" sc-camel-on-click=\"{{ copyHero }}\" aria-label=\"Copy install command\" style=\"padding-inline:12px\"><span class=\"icon\" style=\"mask-image:url(&quot;a6e596fd-10b0-46dd-a85c-b2bbf2590866&quot;);-webkit-mask-image:url(&quot;a6e596fd-10b0-46dd-a85c-b2bbf2590866&quot;)\"><\u002Fspan><\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ cp.heroOn }}\" hint-pl
